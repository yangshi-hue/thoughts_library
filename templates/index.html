<!DOCTYPE html>
<html>
<head>
    <title>Thoughts Library</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<a href="{{ url_for('admin_login') }}" style="position: fixed; bottom: 10px; right: 10px; width: 20px; height: 20px; display: block; opacity: 0.15; text-decoration: none;">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="#555">
        <path d="M12 2l2.9 6.9L22 9.6l-5.5 4.8L18.2 22 12 17.8 5.8 22l1.7-7.6L2 9.6l7.1-0.7z"/>
    </svg>
</a>


<body>
<h1> Thoughts Library</h1>
    <p>Book reviews, favorite lines, and random thoughts.</p>

    <div class="review-grid">
        {% for review in reviews %}
        <div class="review-card">
            {% if review.cover_image %}
            <img src="{{ review.cover_image }}" alt="{{ review.title }} cover">
            {% endif %}
            <h2><a href="{{ url_for('review_detail', review_id=review.id) }}">{{ review.title }}</a></h2>
            <p><em>by {{ review.author }}</em></p>
            <p>{{ review.review_text[:150] }}...</p>
        </div>
        {% endfor %}
    </div>
</body>
</html>

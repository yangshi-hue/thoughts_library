<!DOCTYPE html>
<html>
<head>
    <title>{{ review.title }} — Thoughts Library</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <a href="{{ url_for('home') }}" class="back-btn" aria-label="Back to homepage">←</a>

    <h1>{{ review.title }}</h1>
    <p><em>by {{ review.author }}</em></p>

    {% if review.cover_image %}
    <img src="{{ review.cover_image }}" alt="{{ review.title }} cover" style="max-width: 300px;">
    {% endif %}

    <p>{{ review.review_text }}</p>

    {% if review.favorite_quote %}
    <blockquote>"{{ review.favorite_quote }}"</blockquote>
    {% endif %}
</body>
{% include 'nav.html' %}
</html>

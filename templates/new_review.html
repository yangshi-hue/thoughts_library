<!DOCTYPE html>
<html>
<head>
    <title>New Review — Thoughts Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Write a New Review</h1>
    <form method="POST">
        <input type="text" name="title" placeholder="Book title" required><br><br>
        <input type="text" name="author" placeholder="Author" required><br><br>
        <textarea name="review_text" placeholder="Your review..." rows="8" required></textarea><br><br>
        <textarea name="favorite_quote" placeholder="Favorite quote (optional)" rows="3"></textarea><br><br>
        <input type="text" name="cover_image" placeholder="Cover image URL (optional)"><br><br>
        <button type="submit">Publish Review</button>
    </form>
   <a href="{{ url_for('home') }}" class="back-btn" aria-label="Back to homepage">←</a>
</body>
</html>
